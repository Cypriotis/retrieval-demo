name: retrieval-demo
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.3}
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.3}
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
    entrypoint: [/bin/sh, -c]
    command: ['ollama pull "$$CHAT_MODEL" && ollama pull "$$EMBED_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.5}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      DATA_DIR: /data
      RERANK_URL: http://reranker:8001
      RAG_MODE: ${RAG_MODE:-baseline}
      REASONING_ENABLED: ${REASONING_ENABLED:-true}
      REASONING_MAX_DEPTH: ${REASONING_MAX_DEPTH:-3}
      REASONING_MAX_NODES: ${REASONING_MAX_NODES:-10}
      REASONING_MAX_PLANNING_ATTEMPTS: ${REASONING_MAX_PLANNING_ATTEMPTS:-2}
      REASONING_MAX_EXECUTION_STEPS: ${REASONING_MAX_EXECUTION_STEPS:-15}
      REASONING_MAX_PARALLEL_NODES: ${REASONING_MAX_PARALLEL_NODES:-3}
      REASONING_TIMEOUT_SECONDS: ${REASONING_TIMEOUT_SECONDS:-120}
      REASONING_NODE_TIMEOUT_SECONDS: ${REASONING_NODE_TIMEOUT_SECONDS:-60}
      REASONING_MAX_NODE_ATTEMPTS: ${REASONING_MAX_NODE_ATTEMPTS:-2}
      REASONING_RECOVERY_ENABLED: ${REASONING_RECOVERY_ENABLED:-true}
      REASONING_MAX_RECOVERY_ATTEMPTS_PER_NODE: ${REASONING_MAX_RECOVERY_ATTEMPTS_PER_NODE:-1}
      REASONING_MAX_TOTAL_RECOVERY_ATTEMPTS: ${REASONING_MAX_TOTAL_RECOVERY_ATTEMPTS:-3}
      REASONING_TRACING_ENABLED: ${REASONING_TRACING_ENABLED:-true}
      REASONING_SUPPORT_VERIFIER: ${REASONING_SUPPORT_VERIFIER:-none}
      REASONING_FALLBACK_ENABLED: ${REASONING_FALLBACK_ENABLED:-false}
    volumes:
      - app-data:/data
    depends_on:
      model-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      reranker:
        condition: service_started
    restart: unless-stopped
  reranker:
    build:
      context: .
      dockerfile: reranker/Dockerfile
    environment:
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_REVISION: ${RERANK_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      HF_HUB_DISABLE_XET: "1"
    volumes: ["reranker-data:/models"]
    restart: unless-stopped
volumes:
  ollama-data:
  qdrant-data:
  app-data:
  reranker-data:
