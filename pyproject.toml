[project]
name = "retrieval-demo"
version = "0.1.0"
description = "Local, observable PDF RAG comparisons with Qwen and Qdrant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "pypdf==5.5.0",
  "python-multipart==0.0.20",
  "pysbd==0.3.4",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
